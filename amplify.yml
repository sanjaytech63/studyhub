version: 1

applications:
  - appRoot: apps/web

    frontend:
      phases:
        preBuild:
          commands:
            - nvm use 24
            - node --version
            - npm --version
            - HUSKY=0 npm ci --cache .npm --prefer-offline

        build:
          commands:
            - npm run build

      artifacts:
        baseDirectory: .next
        files:
          - '**/*'

      cache:
        paths:
          - node_modules/**/*
          - .npm/**/*
