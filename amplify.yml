version: 1

applications:
  - appRoot: apps/web

    frontend:
      buildPath: /

      phases:
        preBuild:
          commands:
            - nvm use 24
            - node --version
            - npm --version
            - echo "=== START npm ci ==="
            - HUSKY=0 npm ci --ignore-scripts
            - echo "=== npm ci COMPLETE ==="

        build:
          commands:
            - echo "=== START WEB BUILD ==="
            - npm run build:web
            - echo "=== WEB BUILD COMPLETE ==="

      artifacts:
        baseDirectory: apps/web/.next
        files:
          - '**/*'

      cache:
        paths:
          - .npm/**/*
