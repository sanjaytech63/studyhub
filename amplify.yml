version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 24
        - node --version
        - npm --version
        - npm ci --cache .npm --prefer-offline

    build:
      commands:
        - npm run build

  artifacts:
    baseDirectory: .next
    files:
      - '**/*'

  cache:
    paths:
      - node_modules/**/*
      - .npm/**/*
