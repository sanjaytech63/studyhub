name: CI

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - develop

jobs:
  quality:
    name: Code Quality
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_APP_NAME: StudyHub
      # Dummy DATABASE_URL required by Prisma generate (does not connect)
      DATABASE_URL: postgresql://build:build@localhost:5432/build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          HUSKY: 0

      - name: Generate Prisma client
        run: npm run db:generate --workspace=@studyhub/database

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Validate environment
        run: |
          test -n "$NEXT_PUBLIC_API_URL" || {
            echo "::error::NEXT_PUBLIC_API_URL is missing"
            exit 1
          }

          test -n "$NEXT_PUBLIC_APP_URL" || {
            echo "::error::NEXT_PUBLIC_APP_URL is missing"
            exit 1
          }

          test -n "$NEXT_PUBLIC_APP_NAME" || {
            echo "::error::NEXT_PUBLIC_APP_NAME is missing"
            exit 1
          }

          echo "Web environment variables are configured."

      - name: Build web
        run: npm run build:web

      - name: Test
        run: npm test
