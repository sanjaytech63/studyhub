name: Deploy to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Production EC2
    runs-on: ubuntu-latest
    environment: EC2_HOST

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST || '15.206.223.108' }}
          username: ${{ secrets.EC2_USER || 'ubuntu' }}
          key: ${{ secrets.EC2_SSH_KEY || secrets.SSH_KEY || secrets.SSH_PRIVATE_KEY || secrets.EC2_KEY || vars.EC2_SSH_KEY || vars.SSH_KEY }}
          port: 22
          timeout: 3600s
          command_timeout: 3600s
          script: |
            set -e
            echo "🚀 Starting automated deployment on EC2..."

            cd ~/studyhub
            git config --global --add safe.directory /home/ubuntu/studyhub || true

            # 1. Ensure swap memory is configured on EC2 (prevents Next.js build memory freeze)
            if ! swapon --show | grep -q "/swapfile"; then
              echo "⚙️ Setting up 2GB swap space..."
              sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chmod 600 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
              grep -qxF '/swapfile none swap sw 0 0' /etc/fstab || echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
            fi

            # 2. Pull latest code from main
            echo "📥 Pulling latest changes from main branch..."
            git pull origin main

            # 3. Build containers sequentially to prevent CPU/RAM exhaustion
            echo "📦 Building API and Worker..."
            docker compose -f docker-compose.prod.yml build api worker

            echo "📦 Building Admin (Next.js)..."
            docker compose -f docker-compose.prod.yml build admin

            echo "📦 Building Web (Next.js)..."
            docker compose -f docker-compose.prod.yml build web

            # 4. Start production containers
            echo "🚀 Starting production containers..."
            docker compose -f docker-compose.prod.yml up -d

            # 5. Apply database migrations to RDS PostgreSQL
            echo "🗄️ Applying pending database migrations to RDS PostgreSQL..."
            docker compose -f docker-compose.prod.yml exec -T api npm run db:deploy || true

            # 6. Clean up dangling images to save disk space
            echo "🧹 Pruning unused Docker cache..."
            docker image prune -f

            # 7. Check container health status
            echo "✅ Container status:"
            docker compose -f docker-compose.prod.yml ps

            echo "🎉 Deployment completed successfully!"
